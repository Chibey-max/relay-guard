<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    Relay Guard: "the threshold".

    The one thing this product does is stand between a sentence and a
    signature, so that is what the artwork shows. Payment intents enter as
    hairlines from the left, reach a gate, and leave carrying a verdict:
    sage for ALLOW, amber for REVIEW (held at the gate, waiting on a human),
    brick for BLOCK (stopped short of it, never reaching the signature).

    Every colour is a token already in app/globals.css (ink, line, line2,
    mist, chalk, check, amber), so this reads as native to the app rather
    than borrowed. Warm near-black and desaturated sage/terracotta, and
    deliberately not the cold periwinkle-and-mint of anyone else's brand.

    The motif is centred vertically and sits right of centre, because this
    is used two ways: as a fixed backdrop on /app, where a centred content
    column covers the middle, and as a short full-bleed band on the landing
    page, where "slice" crops the top and bottom away.
  -->
  <defs>
    <!-- userSpaceOnUse, not the default: a horizontal line has a zero-height
         bounding box, so objectBoundingBox gradients collapse on it. -->
    <linearGradient id="approach" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1380" y2="0">
      <stop offset="0" stop-color="#9B9A8E" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#9B9A8E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9B9A8E" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="approachBright" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1380" y2="0">
      <stop offset="0" stop-color="#F2F1EA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2F1EA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2F1EA" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cleared" gradientUnits="userSpaceOnUse" x1="1380" y1="0" x2="1800" y2="0">
      <stop offset="0" stop-color="#B8D9A8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#B8D9A8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="stopped" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#A8443A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A8443A" stop-opacity="0.42"/>
    </linearGradient>

    <radialGradient id="gateGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8D9A8" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#2E4A25" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#2E4A25" stop-opacity="0"/>
    </radialGradient>

    <!-- Keeps the left and bottom, where page content sits, quiet enough
         to read body text over. -->
    <radialGradient id="vignette" cx="62%" cy="50%" r="78%">
      <stop offset="0" stop-color="#0B0B0A" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#0B0B0A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0B0B0A" stop-opacity="0.88"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0B0B0A"/>

  <!-- warm light bleeding through the gate -->
  <circle cx="1380" cy="540" r="620" fill="url(#gateGlow)"/>

  <!-- Risk dial: two measured arcs around the gate. The dashed outer one
       reads as a scale rather than decoration. -->
  <g fill="none" stroke="#38382C">
    <path d="M1380 200 A 340 340 0 0 1 1380 880" stroke-opacity="0.5"/>
    <path d="M1380 70 A 470 470 0 0 1 1380 1010" stroke-opacity="0.3" stroke-dasharray="2 14"/>
  </g>

  <!-- Intent lines. y values are 48 apart and centred on 540. -->
  <g stroke-width="2" stroke-linecap="butt">
    <!-- ALLOW -->
    <line x1="120" y1="420" x2="1380" y2="420" stroke="url(#approach)"/>
    <line x1="1380" y1="420" x2="1720" y2="420" stroke="url(#cleared)"/>
    <circle cx="1720" cy="420" r="3.5" fill="#B8D9A8" fill-opacity="0.65" stroke="none"/>

    <!-- ALLOW -->
    <line x1="120" y1="468" x2="1380" y2="468" stroke="url(#approach)"/>
    <line x1="1380" y1="468" x2="1610" y2="468" stroke="url(#cleared)"/>
    <circle cx="1610" cy="468" r="3.5" fill="#B8D9A8" fill-opacity="0.55" stroke="none"/>

    <!-- BLOCK: stopped well short of the gate, with a blunt terminus. -->
    <line x1="120" y1="516" x2="1180" y2="516" stroke="url(#stopped)"/>
    <line x1="1180" y1="498" x2="1180" y2="534" stroke="#A8443A" stroke-opacity="0.5"/>

    <!-- ALLOW: the one that carries through, brightest of the set. -->
    <line x1="120" y1="564" x2="1380" y2="564" stroke="url(#approachBright)"/>
    <line x1="1380" y1="564" x2="1820" y2="564" stroke="url(#cleared)"/>
    <circle cx="1820" cy="564" r="4.5" fill="#B8D9A8" fill-opacity="0.8" stroke="none"/>

    <!-- REVIEW: reaches the gate and is held there. The dashes past it are
         the send that only continues once a human acknowledges it. -->
    <line x1="120" y1="612" x2="1380" y2="612" stroke="url(#approach)"/>
    <line x1="1380" y1="612" x2="1660" y2="612" stroke="#D2965A" stroke-opacity="0.42" stroke-dasharray="3 12"/>
    <circle cx="1380" cy="612" r="6" fill="none" stroke="#D2965A" stroke-opacity="0.85"/>

    <!-- ALLOW -->
    <line x1="120" y1="660" x2="1380" y2="660" stroke="url(#approach)"/>
    <line x1="1380" y1="660" x2="1560" y2="660" stroke="url(#cleared)"/>
    <circle cx="1560" cy="660" r="3" fill="#B8D9A8" fill-opacity="0.45" stroke="none"/>
  </g>

  <!-- The gate itself: a bracketed threshold, not just a rule. -->
  <g stroke="#F2F1EA" fill="none">
    <line x1="1380" y1="336" x2="1380" y2="744" stroke-width="2" stroke-opacity="0.26"/>
    <path d="M1356 336 H1404 M1356 744 H1404" stroke-width="2" stroke-opacity="0.4"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>

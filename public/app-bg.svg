<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8FB3C9"/>
    </pattern>
    <radialGradient id="dotFade" cx="62%" cy="48%" r="55%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="1920" height="1080" fill="url(#dotFade)"/>
    </mask>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="80%">
      <stop offset="0.55" stop-color="#05070C" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070C" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- deep navy base -->
  <rect width="1920" height="1080" fill="#070B14"/>

  <!-- soft light sources -->
  <g filter="url(#glow)">
    <ellipse cx="380" cy="980" rx="620" ry="260" fill="#0F766E" opacity="0.75" transform="rotate(-18 380 980)"/>
    <ellipse cx="1650" cy="140" rx="420" ry="220" fill="#B45309" opacity="0.55" transform="rotate(12 1650 140)"/>
    <ellipse cx="1180" cy="560" rx="360" ry="300" fill="#1E3A5F" opacity="0.9"/>
  </g>

  <!-- dot grid, faded toward edges -->
  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.16" mask="url(#dotMask)"/>

  <!-- large shield outline, slightly blurred -->
  <g filter="url(#soft)" transform="translate(1260 540)">
    <path d="M0 -330 L285 -205 V30 C285 205 160 318 0 365 C-160 318 -285 205 -285 30 V-205 Z"
          fill="none" stroke="url(#shieldStroke)" stroke-width="3"/>
    <path d="M0 -250 L215 -155 V25 C215 158 120 244 0 280 C-120 244 -215 158 -215 25 V-155 Z"
          fill="none" stroke="#5EEAD4" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- three verdict ticks along the shield edge -->
  <g filter="url(#soft)">
    <circle cx="1545" cy="410" r="7" fill="#5EEAD4" opacity="0.8"/>
    <circle cx="1545" cy="570" r="7" fill="#F5A524" opacity="0.7"/>
    <circle cx="1440" cy="780" r="7" fill="#F87171" opacity="0.6"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>

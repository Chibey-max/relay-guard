<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <mask id="ringHole">
      <rect width="1920" height="1080" fill="#fff"/>
      <!-- shield cutout -->
      <path transform="translate(1470 470) rotate(-14)" d="M0 -190 L165 -118 V20 C165 120 90 185 0 212 C-90 185 -165 120 -165 20 V-118 Z" fill="#000"/>
    </mask>
    <radialGradient id="vignette" cx="35%" cy="45%" r="75%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#000"/>

  <g filter="url(#soft)">
    <!-- periwinkle slab, top -->
    <path d="M1010 -60 L1560 -60 L1330 170 C1310 190 1280 196 1250 188 L1060 140 C1020 130 1000 90 1010 50 Z" fill="#5E6BF0" opacity="0.85"/>
    <!-- grey ring with shield cutout -->
    <circle cx="1470" cy="470" r="400" fill="#3A3A3F" mask="url(#ringHole)"/>
    <!-- mint wedge, bottom right -->
    <path d="M1690 760 L1990 790 L1990 1140 L1880 1140 L1700 930 C1665 890 1655 830 1690 760 Z" fill="#00C27A" opacity="0.9"/>
    <!-- small mint accent, left -->
    <circle cx="210" cy="880" r="70" fill="#00F59B" opacity="0.18"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
